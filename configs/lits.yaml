# LiTS17 (Kaggle mirror) + one pretrained model: NVIDIA VISTA3D (MONAI) for liver and liver-tumour
# segmentation. Nothing is trained. Run on a GPU (Colab: notebooks/colab_lits_pipeline.ipynb):
#   python -m radagent all --config configs/lits.yaml
# Everything not listed here uses the defaults in radagent/config.py.
run_name: lits
seed: 13

data:
  # Empty -> both Kaggle parts are downloaded with kagglehub (or found in its cache).
  # Or list folders that already contain volume-*.nii and segmentation-*.nii.
  lits_dirs: []
  split_fractions: {calib: 0.5, test: 0.5}   # 131 cases -> 65 calib + 66 test
  max_cases: null                  # e.g. 40 for a quick proportional subset

preprocess:
  hu_window: [-100, 250]
  img_size: 256

segmenter:
  backend: vista3d       # NVIDIA VISTA3D, weights from Hugging Face MONAI/VISTA3D-HF (~870 MB, cached)
  hf_revision: null      # pin a commit for exact reproducibility
  sw_batch_size: 1       # 2-4 on a 40 GB GPU is faster
  overlap: 0.25

vlm:
  backend: none          # one model only; a second reader can be plugged in for research

inference:
  tta_flip: true         # 2 passes: CT and its left-right mirror image (uncertainty)
  viewer_size: 192
  viewer_max_slices: 64

readers:
  seeds: 30
